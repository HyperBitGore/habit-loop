<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./users.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <form id="login-form" class="auth-card">
        <p class="eyebrow">Habit Loop</p>
        <h1>Welcome back</h1>
        <p class="auth-intro">Log in to manage your habits and todos.</p>

        <label for="name">Name</label>
        <input id="name" name="name" type="name" autocomplete="name" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="login-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" id="login-button">Log in</button>
      </form>
    </main>
  </body>
</html>

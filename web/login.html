<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./users.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <form id="login-form" class="auth-card">
        <p class="eyebrow">Habit Loop</p>
        <h1>Welcome back</h1>
        <p class="auth-intro">Log in to manage your habits and todos.</p>

        <label for="name">Name</label>
        <input id="name" name="name" type="name" autocomplete="name" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="login-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" id="login-button">Log in</button>
        <button type="button" id="open-registration-button" class="auth-secondary">Create an account</button>
        <a class="page-link" href="./forgot-password.html">Forgot your password?</a>
      </form>

      <div id="registration-popup" class="todo-popup-overlay" hidden>
        <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="registration-title">
          <h2 id="registration-title">Create an account</h2>
          <form id="registration-form">
            <label for="registration-name">Name</label>
            <input id="registration-name" name="name" type="text" autocomplete="username" required />

            <label for="registration-email">Email</label>
            <input id="registration-email" name="email" type="email" autocomplete="email" required />

            <label for="registration-password">Password</label>
            <input id="registration-password" name="password" type="password" autocomplete="new-password" minlength="8" required />

            <label for="registration-password-confirmation">Confirm password</label>
            <input id="registration-password-confirmation" name="password-confirmation" type="password" autocomplete="new-password" minlength="8" required />

            <p id="registration-error" class="auth-error" role="alert" hidden></p>
            <div class="popup-actions">
              <button type="submit">Register</button>
              <button type="button" id="close-registration-button" class="auth-secondary">Cancel</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>

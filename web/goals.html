<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goals - Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./site-config.js"></script>
    <script type="module" src="./page-nav.js"></script>
    <script type="module" src="./goals.js"></script>
  </head>
  <body>
    <header class="page-header">
      <a class="wordmark" data-site-title href="./todo.html">Habit Loop</a>
      <nav class="page-actions" aria-label="Page navigation">
        <a class="button-link" href="./todo.html">Dashboard</a>
        <a class="button-link" href="./goals.html">Goals</a>
        <a class="button-link" href="./history.html">Todo history</a>
        <a class="button-link" href="./habit-summary.html">Habit summaries</a>
      </nav>
      <div class="settings-menu">
        <button id="settings-toggle" class="icon-button settings-toggle" type="button" aria-label="Open settings menu" aria-controls="settings-dropdown" aria-expanded="false"><span aria-hidden="true">⚙</span></button>
        <div id="settings-dropdown" class="settings-dropdown" hidden>
          <a href="./profile.html">User settings</a>
          <a id="admin-link" href="./admin.html" hidden>Admin</a>
          <button id="logout" type="button">Log out</button>
        </div>
      </div>
    </header>
    <main class="dashboard secondary-page">
      <div class="dashboard-toolbar">
        <div>
          <p class="eyebrow">Longer horizon</p>
          <h1>Goals</h1>
        </div>
        <button id="add-goal" type="button">Add goal</button>
      </div>
      <div id="goals" class="goal-list"></div>
    </main>
    <div id="goal-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="goal-popup-title">
        <button id="goal-close" class="dialog-close" type="button" aria-label="Close">×</button>
        <h2 id="goal-popup-title">Add goal</h2>
        <form id="goal-form">
          <input id="goal-id" type="hidden" />
          <label for="goal-name">Goal name</label>
          <input id="goal-name" required maxlength="200" />
          <div class="goal-item-editor">
            <label>Goal todos</label>
            <div id="goal-items"></div>
            <button id="add-goal-item" class="secondary-button" type="button">Add todo</button>
          </div>
          <button type="submit">Save goal</button>
        </form>
      </section>
    </div>
  </body>
</html>

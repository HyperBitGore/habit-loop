<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set new password | Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./reset-password.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <form id="reset-password-form" class="auth-card">
        <p class="eyebrow">Habit Loop</p>
        <h1>Set a new password</h1>
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" minlength="8" autocomplete="new-password" required />
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
        <p id="reset-message" class="auth-error" role="alert" hidden></p>
        <button type="submit">Update password</button>
        <a class="auth-secondary auth-secondary-link" href="./login.html">Back to login</a>
      </form>
    </main>
  </body>
</html>

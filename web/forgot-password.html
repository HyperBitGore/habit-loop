<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password | Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script id="turnstile-script" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
    <script type="module" src="./forgot-password.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <form id="forgot-password-form" class="auth-card">
        <p class="eyebrow">Habit Loop</p>
        <h1>Reset your password</h1>
        <p class="auth-intro">Enter your account email and we will send you a reset link.</p>
        <label for="reset-email">Email</label>
        <input id="reset-email" name="email" type="email" autocomplete="email" required />
        <div id="password-reset-turnstile" class="turnstile-widget" aria-label="Bot verification"></div>
        <p id="reset-message" class="auth-error" role="status" hidden></p>
        <button type="submit">Send reset link</button>
        <a class="auth-secondary auth-secondary-link" href="./login.html">Back to login</a>
      </form>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Habits</h1>
      <div class="header-actions">
        <button id="manage-users" type="button" hidden>Manage Users</button>
        <button id="create-user" type="button" hidden>Create User</button>
        <a class="button-link" href="./profile.html">Profile</a>
        <button id="logout" type="button">Logout</button>
        <label for="task-date">Date</label>
        <input id="task-date" type="date" />
      </div>
    </header>
    <div class="add-actions">
      <button id="add-todo" type="button">Add Todo</button>
      <button id="add-habit" type="button">Add Habit</button>
    </div>
    <ul id="todo-list" aria-live="polite"></ul>

    <div id="todo-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="todo-popup-title">
        <button id="todo-close" type="button">Close</button>
        <h2 id="todo-popup-title">Add Todo</h2>
        <label for="todo-title">TODO Name</label>
        <input id="todo-title" type="text" />
        <button type="button" id="todo-save">Save</button>
      </section>
    </div>

    <div id="habit-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="habit-popup-title">
        <button id="habit-close" type="button">Close</button>
        <h2 id="habit-popup-title">Add Habit</h2>
        <form id="habit-form">
          <label for="habit-name">Habit Name</label>
          <input id="habit-name" name="name" type="text" required />
          <p id="habit-error" class="auth-error" role="alert" hidden></p>
          <button type="submit">Save</button>
        </form>
      </section>
    </div>

    <div id="habit-detail-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="habit-detail-title">
        <button id="habit-detail-close" type="button">Close</button>
        <h2 id="habit-detail-title">Edit Habit</h2>
        <form id="habit-detail-form">
          <label for="habit-detail-name">Habit Name</label>
          <input id="habit-detail-name" name="name" type="text" required />
          <dl class="habit-stats">
            <div>
              <dt>Total completed</dt>
              <dd id="habit-total-completions">0 days</dd>
            </div>
            <div>
              <dt>Current streak</dt>
              <dd id="habit-current-streak">0 days</dd>
            </div>
            <div>
              <dt>Longest streak</dt>
              <dd id="habit-longest-streak">0 days</dd>
            </div>
            <div>
              <dt>Total skipped</dt>
              <dd id="habit-total-skips">0 days</dd>
            </div>
          </dl>
          <section class="habit-calendar" aria-labelledby="habit-calendar-month">
            <div class="habit-calendar-controls">
              <button id="habit-calendar-previous" type="button" aria-label="Previous month">←</button>
              <h3 id="habit-calendar-month"></h3>
              <button id="habit-calendar-next" type="button" aria-label="Next month">→</button>
            </div>
            <div class="habit-calendar-weekdays" aria-hidden="true">
              <span>Sun</span>
              <span>Mon</span>
              <span>Tue</span>
              <span>Wed</span>
              <span>Thu</span>
              <span>Fri</span>
              <span>Sat</span>
            </div>
            <div id="habit-calendar-days" class="habit-calendar-days"></div>
          </section>
          <p id="habit-detail-error" class="auth-error" role="alert" hidden></p>
          <button type="submit">Save</button>
          <button id="habit-detail-delete" type="button">Delete</button>
        </form>
      </section>
    </div>

    <div id="todo-detail-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="todo-detail-title">
        <button id="todo-detail-close" type="button">Close</button>
        <h2 id="todo-detail-title">Edit Todo</h2>
        <label for="todo-detail-name">TODO Name</label>
        <input id="todo-detail-name" type="text" />
        <p>Date: <span id="todo-detail-date"></span></p>
        <p>Complete: <span id="todo-detail-complete"></span></p>
        <button type="button" id="todo-detail-save">Save</button>
        <button type="button" id="todo-detail-delete">Delete</button>
      </section>
    </div>

    <div id="user-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="user-popup-title">
        <button id="user-close" type="button">Close</button>
        <h2 id="user-popup-title">Create User</h2>
        <form id="user-form">
          <label for="user-name">Username</label>
          <input id="user-name" name="name" type="text" required />
          <label for="user-password">Password</label>
          <input id="user-password" name="password" type="password" required />
          <label for="user-role">Role</label>
          <select id="user-role" name="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
          <button type="submit">Create User</button>
        </form>
      </section>
    </div>

    <div id="user-list-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup user-list-popup" role="dialog" aria-modal="true" aria-labelledby="user-list-title">
        <button id="user-list-close" type="button">Close</button>
        <h2 id="user-list-title">Manage Users</h2>
        <p id="user-list-error" class="auth-error" role="alert" hidden></p>
        <div id="user-list" class="user-list"></div>
      </section>
    </div>

  </body>
</html>

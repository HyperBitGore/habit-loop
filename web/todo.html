<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Habits</h1>
      <div class="header-actions">
        <button id="create-user" type="button" hidden>Create User</button>
        <button id="logout" type="button">Logout</button>
      </div>
    </header>
    <button id="add-todo" type="button">Add Todo</button>
    <ul id="todo-list" aria-live="polite"></ul>

    <div id="todo-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="todo-popup-title">
        <button id="todo-close" type="button">Close</button>
        <h2 id="todo-popup-title">Add Todo</h2>
        <label for="todo-title">TODO Name</label>
        <input id="todo-title" type="text" />
        <button type="button" id="todo-save">Save</button>
      </section>
    </div>

    <div id="todo-detail-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="todo-detail-title">
        <button id="todo-detail-close" type="button">Close</button>
        <h2 id="todo-detail-title">Edit Todo</h2>
        <label for="todo-detail-name">TODO Name</label>
        <input id="todo-detail-name" type="text" />
        <p>Date: <span id="todo-detail-date"></span></p>
        <p>Complete: <span id="todo-detail-complete"></span></p>
        <button type="button" id="todo-detail-save">Save</button>
        <button type="button" id="todo-detail-delete">Delete</button>
      </section>
    </div>

    <div id="user-popup" class="todo-popup-overlay" hidden>
      <section class="todo-popup" role="dialog" aria-modal="true" aria-labelledby="user-popup-title">
        <button id="user-close" type="button">Close</button>
        <h2 id="user-popup-title">Create User</h2>
        <form id="user-form">
          <label for="user-name">Username</label>
          <input id="user-name" name="name" type="text" required />
          <label for="user-password">Password</label>
          <input id="user-password" name="password" type="password" required />
          <label for="user-role">Role</label>
          <select id="user-role" name="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
          <button type="submit">Create User</button>
        </form>
      </section>
    </div>
  </body>
</html>

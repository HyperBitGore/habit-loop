<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Habit Loop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./profile.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card profile-card">
        <p class="eyebrow">Habit Loop</p>
        <h1>Your profile</h1>
        <a href="./todo.html">Back to habits</a>

        <form id="profile-form">
          <label for="profile-name">Username</label>
          <input id="profile-name" name="name" type="text" required />
          <label for="profile-email">Email</label>
          <input id="profile-email" name="email" type="email" required />
          <p id="pending-email" class="auth-intro" hidden></p>
          <label for="profile-current-password">Current password when changing email</label>
          <input id="profile-current-password" name="currentPassword" type="password" autocomplete="current-password" />
          <p id="profile-message" class="auth-error" role="status" hidden></p>
          <button type="submit">Save personal info</button>
        </form>

        <h2>Change password</h2>
        <form id="password-form">
          <label for="current-password">Current password</label>
          <input id="current-password" name="currentPassword" type="password" required />
          <label for="new-password">New password</label>
          <input id="new-password" name="newPassword" type="password" minlength="8" maxlength="72" required />
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="72" required />
          <p id="password-message" class="auth-error" role="status" hidden></p>
          <button type="submit">Update password</button>
        </form>

        <button id="logout" class="auth-secondary" type="button">Log out</button>
      </section>
    </main>
  </body>
</html>
